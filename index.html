<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Bac à sable</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout : une plage en coupe. Le ciel en haut, le sable en bas, un chemin de seaux qui descend vers la mer. */
:root{
  --sky:#BFE7FF; --sky-2:#E4F5FF; --sand:#FFD766; --sand-2:#FFEFB8; --ink:#14235E; --ink-2:#44507F;
  --coral:#E8384F; --sea:#0B8C8C; --paper:#FFFFFF; --line:#14235E;
  --cloud:#FFFFFF; --sun:#FFB400; --wave:#37BCC8; --wave2:#0B8C8C; --on-coral:#FFFFFF; --on-sea:#FFFFFF; --crab:#F2495C; --crab-dark:#B42238;
  --good:#0A7A5A; --bad:#B42238; --good-bg:#D9F6EA; --bad-bg:#FFE3E6;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible","Trebuchet MS",Verdana,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#10194A; --sky-2:#18245F; --sand:#D9A93A; --sand-2:#2A2A52; --ink:#F4F2FF; --ink-2:#BFC5EA;
  --coral:#FF7C8D; --sea:#4FD6CF; --paper:#1D2A69; --line:#8E9BE0;
  --cloud:#2F3E8F; --sun:#F6E7A6; --wave:#1F7E8F; --wave2:#155B75; --on-coral:#2A0810; --on-sea:#032A2A; --crab:#FF7C8D; --crab-dark:#C93E52;
  --good:#6FE7BD; --bad:#FF9AA7; --good-bg:#123F3C; --bad-bg:#4A1B33; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#10194A; --sky-2:#18245F; --sand:#D9A93A; --sand-2:#2A2A52; --ink:#F4F2FF; --ink-2:#BFC5EA;
  --coral:#FF7C8D; --sea:#4FD6CF; --paper:#1D2A69; --line:#8E9BE0;
  --cloud:#2F3E8F; --sun:#F6E7A6; --wave:#1F7E8F; --wave2:#155B75; --on-coral:#2A0810; --on-sea:#032A2A; --crab:#FF7C8D; --crab-dark:#C93E52;
  --good:#6FE7BD; --bad:#FF9AA7; --good-bg:#123F3C; --bad-bg:#4A1B33; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--sky-2);color:var(--ink);font:400 1.0625rem/1.6 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:760px;margin-inline:auto;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(3.2rem,14vw,5.6rem);letter-spacing:.005em}
h2{font-size:clamp(1.9rem,6vw,2.8rem)}
h3{font-size:1.4rem}
p{margin:0}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:2px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:6px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack-l{display:flex;flex-direction:column;gap:32px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--coral);color:var(--on-coral);border:2px solid var(--line);border-radius:999px;padding:12px 22px;font-weight:700;box-shadow:0 4px 0 var(--line);transition:transform .1s,box-shadow .1s;text-align:center}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.sea{background:var(--sea);color:var(--on-sea)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Accueil */
html,body{overflow-x:clip}
.hero{background:var(--sky);margin-inline:calc(50% - 50vw);padding-block:40px 0;position:relative;overflow:hidden}
.hero .wrap{display:flex;flex-direction:column;gap:14px}
.hero>.wrap,.check>.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tag{font-weight:700;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.lede{font-size:1.25rem;max-width:34em;line-height:1.45}
.beach{display:block;width:100%;height:56px;margin-top:-1px}
.beach path{fill:var(--sand)}
.check{background:var(--sand);margin-inline:calc(50% - 50vw);padding-block:6px 40px;color:#14235E}
.check a{color:#14235E}
.check-grid{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:22px;align-items:center}
.crab-box{height:170px;display:flex;align-items:flex-end;justify-content:center}
#crab,#crab2{width:190px;max-width:100%;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.crab-body{fill:var(--crab)} .crab-claw{fill:var(--crab);stroke:var(--crab-dark);stroke-width:3}
.crab-leg{stroke:var(--crab-dark);stroke-width:6;stroke-linecap:round;fill:none}
.crab-eye{fill:#fff;stroke:#14235E;stroke-width:3}.crab-pupil{fill:#14235E}
.crab-mouth{stroke:#14235E;stroke-width:4;fill:none;stroke-linecap:round}
input[type=range]{width:100%;accent-color:var(--coral);height:32px}
.scale{display:flex;justify-content:space-between;font-size:.88rem;font-weight:700}
.big-num{font:400 1.5rem/1 var(--display)}

/* Chemin */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;position:relative}
.path::before{content:"";position:absolute;left:37px;top:30px;bottom:30px;border-left:4px dotted var(--line);opacity:.45}
.stop{position:relative;display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 16px 14px 8px}
.stop:hover{background:var(--sand-2)}
.num{width:58px;height:58px;margin-inline:auto;position:relative;display:grid;place-items:center}
.num svg{position:absolute;inset:0;width:100%;height:100%}
.num b{position:relative;font:400 1.5rem/1 var(--display);color:#14235E;padding-top:10px}
.stop h3{font-size:1.35rem}
.stop small{display:block;color:var(--ink-2);font-size:.95rem;line-height:1.35;margin-top:3px}
.stop .state{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;border:2px solid var(--line);white-space:nowrap}
.stop.done .state{background:var(--sea);color:var(--on-sea)}
.shells{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.shell{width:34px;height:34px}.shell path{fill:none;stroke:var(--line);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.shell.on .fill{fill:var(--coral)}
.shell .fill{fill:transparent}

/* Étape */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:6px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.step-head{display:flex;flex-direction:column;gap:10px;padding-block:6px 10px}
.prose{display:flex;flex-direction:column;gap:12px;max-width:62ch}
.block{display:flex;flex-direction:column;gap:14px;min-width:0}
.block>.kind{font-weight:700;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--sea)}
.res{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.res a{display:flex;flex-direction:column;gap:3px;padding:14px 16px;background:var(--paper);border:2px solid var(--line);border-radius:14px;text-decoration:none}
.res a:hover{background:var(--sand-2)}
.res b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.res span{font-size:.92rem;color:var(--ink-2);line-height:1.35}
.res em{font-style:normal;font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sea)}
.game{background:var(--sand-2);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.q{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.q .choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{background:var(--sky-2);border:2px solid var(--line);border-radius:999px;padding:7px 15px;font-weight:700;font-size:.97rem}
.choice:hover{background:var(--sand)}
.choice:hover:not([disabled]){color:#14235E}
.choice.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.choice.ko{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.fb{font-size:.97rem;line-height:1.45}
.score{font:400 1.2rem/1.2 var(--display)}
.cine{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.cine label{display:grid;grid-template-columns:44px minmax(0,1fr) 22px;gap:10px;align-items:start;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.cine .l{font:400 2rem/1 var(--display);color:var(--coral)}
.cine input{width:20px;height:20px;accent-color:var(--coral);margin:2px 0 0}
.cine small{display:block;font-size:.92rem;color:var(--ink-2);line-height:1.35}
.tips{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.tips li{background:var(--paper);border:2px dashed var(--line);border-radius:12px;padding:10px 14px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700}
.note{font-size:.92rem;color:var(--ink-2);line-height:1.45}

/* Respiration */
.lung{display:flex;flex-direction:column;align-items:center;gap:14px}
.bubble-zone{width:min(100%,260px);aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);border-radius:50%;overflow:hidden}
.bubble{grid-area:1/1;width:100%;height:100%;border-radius:50%;background:var(--sea);transform:scale(.38);transition:transform 5s ease-in-out}
.bubble-txt{grid-area:1/1;font:400 1.6rem/1 var(--display);z-index:1;color:var(--ink);background:var(--paper);padding:8px 14px;border-radius:999px;border:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.row.left{justify-content:flex-start}
.pill[aria-pressed=true]{background:var(--sand);color:#14235E}
.senses{display:flex;flex-direction:column;gap:6px}
.senses p{font-size:1.15rem;font-weight:700}

/* Fin */
.finish{background:var(--sea);color:var(--on-sea);border:2px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}
.finish .btn{align-self:flex-start;background:var(--sand);color:#14235E}
.card{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:6px 6px 0 var(--coral)}
.card dl{margin:0;display:flex;flex-direction:column;gap:8px}
.card dt{font-weight:700;font-size:.82rem;letter-spacing:.07em;text-transform:uppercase;color:var(--sea)}
.card dd{margin:0;overflow-wrap:anywhere}
.habits{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.habits label{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.habits input{width:20px;height:20px;accent-color:var(--coral);flex:none;margin-top:3px}

/* Illustrations */
.hero .wrap.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;align-items:end;position:relative;z-index:1}
.hero-txt{display:flex;flex-direction:column;gap:14px;padding-bottom:24px;min-width:0}
.hero-scene{width:100%;max-width:100%;display:block;margin-bottom:-30px}
.scene{display:block;width:100%;height:auto;max-width:100%;border:2px solid var(--line);border-radius:20px}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.flow li{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.flow svg{width:44px;height:44px}
.flow b{font:400 1.1rem/1.1 var(--display)}
.flow span{font-size:.9rem;line-height:1.35;color:var(--ink-2)}
.recipe-row{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:14px;align-items:center}
#rbucket svg{width:100%;max-width:130px;display:block;margin-inline:auto}
.piles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pile{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px;min-width:0}
.pile.me{background:var(--sand);color:#14235E}
.pile.sea{background:var(--wave);color:#0B1B45}
.pile b{font:400 1.08rem/1.15 var(--display)}
.pile .why{font-size:.9rem;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#fff;color:#14235E;border:1.5px solid #14235E;border-radius:999px;padding:2px 9px;font-size:.84rem;font-weight:700;animation:drop .35s ease-out}
.res em svg{width:13px;height:13px;vertical-align:-1px;margin-right:5px;fill:currentColor}
.sea-end{display:block;width:100%;height:auto;border:2px solid var(--line);border-radius:18px}
.finish-head{display:flex;align-items:center;gap:12px}
.finish .shell{width:58px;height:58px;flex:none}
.finish .shell path{stroke:var(--on-sea)}
.finish .shell.on .fill{fill:var(--sand)}
.shell.on{animation:wiggle .6s ease-out}
.card{position:relative;overflow:hidden}
.card-crab{position:absolute;right:8px;top:8px;width:74px;height:auto}
.card h3{padding-right:80px}
.a-shake{transform-origin:570px 40px;animation:shake 1.4s ease-in-out infinite}
.a-float{animation:floaty 3.5s ease-in-out infinite}
.a-wave{animation:wave 7s linear infinite}
.a-breath{transform-box:fill-box;transform-origin:center;animation:breath 10s ease-in-out infinite}
.a-sun{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes shake{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(7deg)}80%{transform:rotate(-7deg)}90%{transform:rotate(4deg)}}
@keyframes floaty{50%{transform:translateY(-7px)}}
@keyframes wave{to{transform:translateX(-200px)}}
@keyframes breath{50%{transform:scale(1.35)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drop{from{transform:translateY(-10px);opacity:.2}}
@keyframes wiggle{30%{transform:rotate(-14deg) scale(1.2)}60%{transform:rotate(10deg)}}
@media (max-width:640px){
  .hero .wrap.hero-grid{grid-template-columns:minmax(0,1fr)}
  .hero-txt{padding-bottom:0}
  .hero-scene{max-width:250px;justify-self:end;margin-top:-10px}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .recipe-row{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:440px){.piles{grid-template-columns:minmax(0,1fr)}}
/* Aide */
.helpbtn{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--sky-2);border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 12px rgba(10,20,60,.28)}
.help{background:var(--paper);border:3px solid var(--coral);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.help ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.help strong{font-size:1.1rem}
.tel{font-weight:700;user-select:all;white-space:nowrap}
.alertbox{background:#fff;color:#14235E;border:2px solid #14235E;border-radius:12px;padding:12px 14px}
.alertbox a{color:#14235E}
.sources{font-size:.92rem;color:var(--ink-2)}
.sources ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
footer{padding-top:30px;display:flex;flex-direction:column;gap:12px}
@media (max-width:560px){
  .check-grid{grid-template-columns:minmax(0,1fr)}
  .crab-box{height:140px;order:-1}
  #crab,#crab2{width:160px}
  .stop{grid-template-columns:60px minmax(0,1fr);padding-left:4px}
  .stop .state{grid-column:2;justify-self:start}
  .path::before{left:29px}
  .num{width:50px;height:50px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<main id="app" class="wrap" aria-live="off"></main>
<button class="helpbtn" id="helpbtn" type="button">Besoin de parler ?</button>

<script>
(function(){
var KEY='bac-a-sable-v1';
var S={before:6,after:null,done:{},game:{},recipe:'',cine:{},thought:'',friend:'',k1:'',k2:'',k3:'',habits:{}};
try{var saved=JSON.parse(localStorage.getItem(KEY));if(saved)S=Object.assign(S,saved)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var app=document.getElementById('app');
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var YT='https://www.youtube.com/watch?v=';
var SURF='https://stresshumain.ca/programmes/surfe-ton-stress/ados/';

function crabSVG(id,val){
  var mood=val<=3?'M86 92 q14 12 28 0':val<=6?'M88 96 q12 0 24 0':'M86 100 q14 -12 28 0';
  var look=val>=8?1:0;
  return '<svg id="'+id+'" viewBox="0 0 200 130" role="img" aria-label="Corti le crabe, taille '+val+' sur 10" style="transform:scale('+(0.55+val*0.055).toFixed(3)+')">'+
  '<path class="crab-leg" d="M48 86 L18 100 M46 96 L20 118 M152 86 L182 100 M154 96 L180 118"/>'+
  '<path class="crab-claw" d="M34 66 C8 62 4 28 24 18 C20 34 30 36 34 26 C50 36 50 60 34 66 Z"/>'+
  '<path class="crab-claw" d="M166 66 C192 62 196 28 176 18 C180 34 170 36 166 26 C150 36 150 60 166 66 Z"/>'+
  '<path class="crab-leg" d="M38 66 L56 76 M162 66 L144 76"/>'+
  '<ellipse class="crab-body" cx="100" cy="86" rx="56" ry="36"/>'+
  '<path class="crab-leg" d="M84 54 L80 34 M116 54 L120 34"/>'+
  '<circle class="crab-eye" cx="80" cy="26" r="'+(look?14:12)+'"/><circle class="crab-eye" cx="120" cy="26" r="'+(look?14:12)+'"/>'+
  '<circle class="crab-pupil" cx="82" cy="27" r="5"/><circle class="crab-pupil" cx="118" cy="27" r="5"/>'+
  '<path class="crab-mouth" d="'+mood+'"/></svg>';
}
function crabLine(v){
  if(v<=2)return 'Corti fait la sieste. Profite, et viens quand même découvrir les outils.';
  if(v<=4)return 'Corti trottine. Il te rappelle juste que quelque chose compte pour toi.';
  if(v<=6)return 'Corti a sorti les pinces. Classique en terminale.';
  if(v<=8)return 'Corti court partout en crabe. On va lui trouver un autre rythme.';
  return 'Corti prend toute la plage. Ce parcours peut aider, et parler à quelqu’un aussi.';
}
function shell(on){return '<svg class="shell'+(on?' on':'')+'" viewBox="0 0 40 40" aria-hidden="true"><path class="fill" d="M20 34 C8 30 3 20 7 11 C13 5 27 5 33 11 C37 20 32 30 20 34Z"/><path d="M20 34 C8 30 3 20 7 11 C13 5 27 5 33 11 C37 20 32 30 20 34Z M20 34 L20 8 M20 34 L12 10 M20 34 L28 10"/></svg>'}
function bucket(){return '<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M10 22 L16 54 H44 L50 22 Z" fill="#FFD766" stroke="#14235E" stroke-width="3" stroke-linejoin="round"/><path d="M12 22 C12 4 48 4 48 22" fill="none" stroke="#14235E" stroke-width="3"/></svg>'}

function scoreText(id,items){
  var g=S.game[id]||{},answered=Object.keys(g).length,good=items.filter(function(q,i){return g[i]===q.a}).length;
  if(!answered)return 'Clique sur tes réponses. Aucune note ne sort d’ici.';
  if(answered<items.length)return good+' bonne'+(good>1?'s':'')+' réponse'+(good>1?'s':'')+' pour l’instant.';
  return good+' sur '+items.length+'. Corti est impressionné.';
}

var VIEWS={
 'etape-1':function(){return shellHead(0)+'<div class="stack-l">'+
  '<section class="prose"><p>Ton cerveau détecte quelque chose d’important. L’amygdale, une petite zone impliquée dans les émotions, sonne l’alarme. L’adrénaline accélère alors ton cœur et ta respiration, et le cortisol prend le relais pour fournir de l’énergie.</p><p>Ce système a été très utile pour échapper aux prédateurs. Il s’active aussi devant une copie de philo, car il ne fait pas bien la différence. Tes mains moites ne disent rien de ton niveau. Elles disent que ton corps se prépare.</p><p>Si tu suis la spécialité SVT, bonne nouvelle : ça fait partie du programme, donc tu révises en plus.</p></section>'+FLOW+
  '<section class="block"><p class="kind">Regarder et lire</p><div class="res">'+

    res('Lecture · 5 min','https://aufutur.fr/revisions/svt/mecanismes-stress/','Le stress, version SVT','Un article de révision d’AuFutur sur l’adrénaline, le cortisol et le retour à l’équilibre.')+
  '</div></section>'+
  '<section class="game"><h2>Vrai ou faux, pince en l’air</h2>'+quizHTML('q1',Q1)+'</section>'+finish(0)+'</div>'},
 'etape-2':function(){
  return shellHead(1)+'<div class="stack-l">'+
  '<section class="prose"><p>La chercheuse Sonia Lupien résume ce qui rend une situation stressante avec quatre lettres : C.I.N.É. Plus une situation en coche, plus le stress grimpe. La terminale est très forte à ce jeu. Parcoursup peut cocher les quatre à lui tout seul.</p></section>'+

    res('Lecture · 4 min','https://www.letudiant.fr/etudes/parcoursup/parcoursup-comment-gerer-son-stress-pendant-la-procedure.html','Parcoursup sans y laisser ses nerfs','Conseils de pros et témoignages d’anciens candidats dans L’Etudiant.')+
  '</div></section>'+
  '<section class="game"><h2>Cuisine ta recette</h2><label class="f" for="recipe">Une situation qui te stresse en ce moment<input type="text" id="recipe" maxlength="140" placeholder="Exemple : le bac blanc de maths" value="'+esc(S.recipe)+'"></label>'+

  '<section class="game"><h2>Ça dépend de moi ?</h2><p>On s’épuise souvent à ruminer sur ce qu’on ne peut pas changer. Ce tri t’aide à voir où ton énergie est utile : tu agis sur ce qui dépend de toi, et tu arrêtes de tourner en boucle sur le reste.</p><p><b>Pour chaque situation, choisis la bonne pile.</b></p>'+quizHTML('q2',Q2)+'<div class="piles" id="piles">'+pilesHTML()+'</div><label class="f" for="act">À toi : une action qui dépend de toi et qui prend moins de 10 minutes<input type="text" id="act" maxlength="120" placeholder="Exemple : noter les dates de mes vœux" value="'+esc(S.act)+'"></label></section>'+finish(1)+'</div>'},
 'etape-3':function(){return shellHead(2)+'<div class="stack-l">'+
  '<section class="prose"><p>Quand le stress monte, raisonner devient difficile. Tu peux passer par le corps, surtout par ton souffle, que tu peux ralentir volontairement. Essaie maintenant, sans attendre d’être stressé ou stressée : un geste s’apprend mieux au calme.</p></section>'+
  '<section class="game"><h2>La bulle</h2><p>Inspire quand la bulle gonfle pendant 5 secondes, expire quand elle dégonfle pendant 5 secondes. C’est le rythme de la cohérence cardiaque. Si la tête te tourne, arrête et respire normalement.</p>'+

  '<section class="game"><h2>Le 5-4-3-2-1 de la salle d’examen</h2><p>Quand ta tête s’emballe, ramène-la dans la pièce. Personne ne verra rien.</p><div class="senses"><p id="sense" aria-live="polite">Clique pour commencer.</p></div><div><button type="button" class="btn alt" id="snext">Commencer</button></div></section>'+
  '<section class="block"><p class="kind">Pour pratiquer guidé</p><div class="res">'+
    res('Vidéo · 6 min','https://www.santementale-info-service.fr/en-prendre-soin/tous-les-exercices/coherence-cardiaque','Cohérence cardiaque guidée','La vidéo de Santé publique France, avec transcription.')+
    res('Vidéos · 3 à 7 min','https://www.chuv.ch/fr/psychiatrie/dp-home/recherche/centres-et-unites-de-recherche/unite-de-recherche-du-service-universitaire-de-psychiatrie-de-lenfant-et-de-ladolescent-supea/coherence-cardiaque','Le bouton d’urgence','L’exercice court du CHUV de Lausanne, avec témoignages de jeunes.')+
    res('Exercice','https://www.santementale-info-service.fr/en-prendre-soin/tous-les-exercices/relaxation-musculaire','Relaxation musculaire','Pour relâcher la mâchoire, les épaules et tout ce qui se crispe.')+
    res('Vidéo · 5 min',YT+'CfJBDS2uXCc','Surfe ton stress, capsule 3 sur 4','La suite de la série, à regarder dans l’ordre.')+
  '</div></section>'+finish(2)+'</div>'},
 'etape-4':function(){return shellHead(3)+'<div class="stack-l">'+
  '<section class="prose"><p>Une pensée stressante a souvent l’air d’un fait. Pourtant, c’est une phrase, et elle exagère parfois. Les psychologues parlent de distorsions cognitives. Tout le monde en fait. Les repérer te donne un peu de recul.</p></section>'+
  '<section class="game"><h2>Attrape la pensée piège</h2>'+quizHTML('q4',Q4)+'</section>'+
  '<section class="game"><h2>Le conseil à ton meilleur ami</h2><p>On est souvent plus juste avec les autres qu’avec soi-même. Profitons-en.</p>'+
  '<label class="f" for="thought">La phrase que ta tête te répète<textarea id="thought" rows="2" maxlength="240" placeholder="Exemple : je n’y arriverai jamais">'+esc(S.thought)+'</textarea></label>'+
  '<label class="f" for="friend">Que répondrais-tu à un ami qui te dirait ça ?<textarea id="friend" rows="3" maxlength="320" placeholder="Exemple : tu as déjà remonté une note cette année, et il te reste du temps">'+esc(S.friend)+'</textarea></label>'+
  '<p class="note">Une réponse utile reste vraie. Pas besoin de te dire que tout ira parfaitement.</p></section>'+
  '<section class="block"><p class="kind">Lire pour aller plus loin</p><div class="res">'+
    res('Lecture · 8 min','https://www.nightline.fr/kit-de-vie/comprendre-mes-biais-de-pensee','Les dix biais de pensée','Le kit de vie de Nightline, avec le tout ou rien, le catastrophisme et les autres.')+
    res('Lecture · 8 min','https://www.nightline.fr/kit-de-vie/identifier-ses-emotions','Identifier ses émotions','Comment chaque émotion se manifeste dans le corps et à quoi elle sert.')+
  '</div></section>'+finish(3)+'</div>'},
 'etape-5':function(){
  var opts=[['bouge','Bouger un peu chaque jour','Une marche de 15 minutes compte.'],['dors','Garder un rythme de sommeil stable','Se coucher à peu près à la même heure, même sans dormir tout de suite.'],['passion','Garder un créneau pour une passion','Il est dans ton agenda, comme un cours.'],['aide','Rendre service à quelqu’un','Expliquer un exercice marche très bien.'],['merci','Noter une chose agréable le soir','Une ligne, même minuscule.']];
  return shellHead(4)+'<div class="stack-l">'+
  '<section class="prose"><p>Tu as testé plusieurs outils. Tous ne te conviendront pas, et c’est normal. Garde les deux ou trois qui t’aident et prévois de les utiliser. Dans ta poche, ils serviront le jour où Corti prendra de la place.</p></section>'+
  '<section class="block"><p class="kind">Dernière vidéo et dernière lecture</p><div class="res">'+
    res('Vidéo · 5 min',YT+'ucC8HuOcDmE','Surfe ton stress, capsule 4 sur 4','La fin de la série. Le programme propose aussi un journal de bord.')+
    res('Boîte à outils','https://www.sante.fr/saider-soi-meme-des-outils-pour-tous','S’aider soi-même','Des outils gratuits et sans publicité, sélectionnés par Psycom.')+
    res('Programme complet',SURF,'Surfe ton stress','Pour revoir les capsules et télécharger le journal de bord.')+
  '</div></section>'+
  '<section class="game"><h2>Choisis tes habitudes</h2><p>Les cinq conseils du Fil Good de Santé publique France. Deux suffisent largement.</p><div class="habits">'+opts.map(function(o){return '<label for="h-'+o[0]+'"><input type="checkbox" id="h-'+o[0]+'" data-habit="'+esc(o[1])+'"'+(S.habits[o[1]]?' checked':'')+'><span><b>'+o[1]+'</b><br><span class="note">'+o[2]+'</span></span></label>'}).join('')+'</div>'+
  '<label class="f" for="k1">Quand ça monte d’un coup, je fais<input type="text" id="k1" maxlength="120" placeholder="Exemple : une minute de bulle" value="'+esc(S.k1)+'"></label>'+
  '<label class="f" for="k2">La phrase que je me redis<input type="text" id="k2" maxlength="140" placeholder="Exemple : une note évalue une copie, pas moi" value="'+esc(S.k2||S.friend)+'"></label>'+
  '<label class="f" for="k3">Si c’est trop lourd, j’en parle à<input type="text" id="k3" maxlength="80" placeholder="Un prénom ou un rôle" value="'+esc(S.k3)+'"></label></section>'+
  '<section class="stack"><h2>Ta carte de plage</h2><div class="card" id="card"></div><div class="row left"><button type="button" class="btn alt" id="copy">Copier ma carte</button><span id="copied" class="note" aria-live="polite"></span></div></section>'+
  '<section class="game"><h2>Et ton crabe, maintenant ?</h2><div class="crab-box" id="box-after">'+crabSVG('crab2',S.after==null?S.before:S.after)+'</div><label for="s-after"><span class="big-num" id="v-after">'+(S.after==null?S.before:S.after)+' / 10</span></label><input type="range" id="s-after" min="0" max="10" value="'+(S.after==null?S.before:S.after)+'"><div class="scale"><span>Tout petit</span><span>Géant</span></div><p id="compare" aria-live="polite">'+compareText()+'</p></section>'+
  finish(4)+'</div>'}
};
function tipsHTML(){
  var on=CINE.filter(function(c){return S.cine[c.k]});
  if(!on.length)return '<p class="note">Coche au moins un ingrédient pour recevoir ta piste.</p>';
  return '<ul class="tips">'+on.map(function(c){return '<li><b>'+c.k+' :</b> '+c.tip+'</li>'}).join('')+'</ul>';
}
function compareText(){
  if(S.after==null)return 'Déplace le curseur pour indiquer où tu en es.';
  var d=S.before-S.after;
  if(d>0)return 'Corti a rétréci de '+d+' point'+(d>1?'s':'')+'. Note ce qui a le mieux marché et garde-le.';
  if(d===0)return 'Même taille qu’au départ. Ces gestes s’apprennent à force de répéter, et une journée chargée pèse aussi. Reviens en essayer un autre demain.';
  return 'Corti a grossi. Ça arrive, certains jours sont plus durs et ce n’est pas un échec. Si ça dure, parles-en à quelqu’un.';
}
function cardText(){
  var h=Object.keys(S.habits).filter(function(k){return S.habits[k]});
  return {a:S.k1||'À compléter',b:S.k2||S.friend||'À compléter',c:h.length?h.join(' · '):'À choisir',d:S.k3||'À compléter'};
}
function renderCard(){
  var el=document.getElementById('card');if(!el)return;var c=cardText();
  el.innerHTML='<svg class="card-crab" viewBox="0 0 200 130" aria-hidden="true">'+crabMini(0,0,1)+'</svg><h3>Mon kit anti-pinces</h3><dl><div><dt>Quand ça monte</dt><dd>'+esc(c.a)+'</dd></div><div><dt>Ma phrase</dt><dd>'+esc(c.b)+'</dd></div><div><dt>Mes habitudes</dt><dd>'+esc(c.c)+'</dd></div><div><dt>Je peux parler à</dt><dd>'+esc(c.d)+'</dd></div></dl>';
}

/* Respiration */
var B={dur:1,on:false,t:null,end:0};
function breatheStop(msg){
  B.on=false;clearTimeout(B.t);
  var b=document.getElementById('bubble'),x=document.getElementById('btxt'),s=document.getElementById('bstart');
  if(b)b.style.transform='scale(.38)';if(x)x.textContent=msg||'Prêt ?';if(s)s.textContent='Lancer la bulle';
}
function breatheCycle(inhale){
  if(!B.on)return;
  if(Date.now()>=B.end){breatheStop('Bien joué');return}
  var b=document.getElementById('bubble'),x=document.getElementById('btxt');if(!b||!x){B.on=false;return}
  b.style.transform=inhale?'scale(1)':'scale(.38)';x.textContent=inhale?'Inspire':'Expire';
  B.t=setTimeout(function(){breatheCycle(!inhale)},5000);
}
var SENSES=['Cherche 5 choses que tu vois.','Sens 4 choses que tu touches : ta chaise, ton stylo, tes pieds sur le sol…','Écoute 3 bruits autour de toi.','Repère 2 odeurs, ou simplement l’air que tu respires.','Prends 1 grande inspiration et reviens à la première question.','Te revoilà dans la salle. Corti a lâché le plafond.'];
var sIdx=-1;

function render(){
  breatheStop();sIdx=-1;
  var id=(location.hash||'').slice(1);
  if(VIEWS[id]){app.innerHTML=VIEWS[id]();renderCard();}
  else home();
  window.scrollTo(0,0);
}
function go(id){
  if(('#'+id)===location.hash||(!id&&!location.hash)){render();return}
  location.hash=id;
  if(!id)render();
}
window.addEventListener('hashchange',render);

document.addEventListener('click',function(ev){
  var t=ev.target.closest('button');if(!t)return;
  if(t.hasAttribute('data-go')){go(t.getAttribute('data-go'));return}
  if(t.hasAttribute('data-help')||t.id==='helpbtn'){showHelp();return}
  if(t.dataset.quiz){
    var id=t.dataset.quiz,i=+t.dataset.i,j=+t.dataset.j,items=QUIZ[id];
    S.game[id]=S.game[id]||{};S.game[id][i]=j;save();
    var q=t.closest('.q');
    q.querySelectorAll('.choice').forEach(function(b,k){b.disabled=true;if(k===items[i].a)b.classList.add('ok');else if(k===j)b.classList.add('ko')});
    q.querySelector('.fb').innerHTML=(j===items[i].a?'<b>Bien vu.</b> ':'<b>Pas tout à fait.</b> ')+items[i].e;
    document.getElementById('score-'+id).textContent=scoreText(id,items);if(id==='q2')document.getElementById('piles').innerHTML=pilesHTML();return;
  }
  if(t.dataset.reset){delete S.game[t.dataset.reset];save();var y=window.scrollY;render();window.scrollTo(0,y);return}
  if(t.dataset.finish!=null){
    var n=+t.dataset.finish;S.done[STEPS[n].id]=true;save();
    go(STEPS[n+1]?STEPS[n+1].id:'');return;
  }
  if(t.dataset.dur){B.dur=+t.dataset.dur;document.querySelectorAll('[data-dur]').forEach(function(b){b.setAttribute('aria-pressed',b===t?'true':'false')});return}
  if(t.id==='bstart'){
    if(B.on){breatheStop();return}
    B.on=true;B.end=Date.now()+B.dur*60000;t.textContent='Arrêter';breatheCycle(true);return;
  }
  if(t.id==='snext'){
    sIdx=(sIdx+1)%SENSES.length;document.getElementById('sense').textContent=SENSES[sIdx];
    t.textContent=sIdx===SENSES.length-1?'Recommencer':'Suivant';return;
  }
  if(t.id==='copy'){
    var c=cardText(),txt='Mon kit anti-pinces\nQuand ça monte : '+c.a+'\nMa phrase : '+c.b+'\nMes habitudes : '+c.c+'\nJe peux parler à : '+c.d;
    var out=document.getElementById('copied');
    var fail=function(){out.textContent='La copie automatique ne marche pas ici. Sélectionne le texte de la carte à la main.'};
    try{navigator.clipboard.writeText(txt).then(function(){out.textContent='Carte copiée.'},fail)}catch(e){fail()}
  }
});
function showHelp(){
  var h=document.getElementById('aide');
  if(h){h.scrollIntoView({behavior:'smooth'});return}
  location.hash='';render();setTimeout(function(){var a=document.getElementById('aide');if(a)a.scrollIntoView()},30);
}
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='recipe'){S.recipe=t.value;save()}
  if(t.id==='act'){S.act=t.value;save()}
  if(t.id==='thought'){S.thought=t.value;save()}
  if(t.id==='friend'){S.friend=t.value;save()}
  if(t.id==='k1'||t.id==='k2'||t.id==='k3'){S[t.id]=t.value;save();renderCard()}
  if(t.id==='s-after'){
    S.after=+t.value;save();
    document.getElementById('v-after').textContent=S.after+' / 10';
    document.getElementById('box-after').innerHTML=crabSVG('crab2',S.after);
    document.getElementById('compare').textContent=compareText();
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset.cine){S.cine[t.dataset.cine]=t.checked;save();document.getElementById('tips').innerHTML=tipsHTML();document.getElementById('rbucket').innerHTML=recipeBucket()}
  if(t.dataset.habit){S.habits[t.dataset.habit]=t.checked;save();renderCard()}
});
render();
})();
</script>
